<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Converser Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>PDF Converser</h1>
    <p class="subtitle">Voice annotations for PDFs</p>

    <div class="form-group">
      <label for="backend-url">Backend URL</label>
      <input type="text" id="backend-url" placeholder="http://localhost:8000/api" />
    </div>

    <div class="status" id="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking...</span>
    </div>

    <div class="actions">
      <button id="save-btn">Save</button>
      <button id="sidebar-btn" class="secondary">Open Notes Panel</button>
    </div>

    <div id="save-msg" class="save-msg" style="display: none;"></div>
  </div>
  <script src="../lib/api-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
