<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Converser</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .start {
      text-align: center;
      max-width: 480px;
      padding: 32px;
    }
    h1 {
      font-weight: 500;
      margin-bottom: 8px;
    }
    p {
      color: #a0a0a0;
      margin-bottom: 24px;
    }
    button {
      background: #2d7ff9;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1a6fee; }
    kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="start">
    <h1>PDF Converser</h1>
    <p>Open a PDF to start annotating.</p>
    <button id="open">Open PDF…</button>
    <p style="margin-top: 16px; font-size: 12px;">or press <kbd>Ctrl</kbd>+<kbd>O</kbd></p>
  </div>
  <script>
    document.getElementById('open').addEventListener('click', () => {
      window.desktop.openPdfDialog();
    });
  </script>
</body>
</html>
